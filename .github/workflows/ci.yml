name: CI

on:
  push:
    branches:
      - main
      - portfolio-v2-engineering
  pull_request:
    branches:
      - main
      - portfolio-v2-engineering

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The repository declares no Node version (no engines, .nvmrc, or .node-version).
      # 24 is chosen deliberately: tests/projects.test.mjs imports src/data/projects.ts
      # directly, which needs Node's unflagged TypeScript type stripping (24 reports
      # process.features.typescript === "strip"), and 24 is the current Active LTS and
      # the only runtime all four checks are verified against.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
